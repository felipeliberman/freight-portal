<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Customer Terms Admin — Freight and Logistics</title>
<style>
  :root { --ac:#bd27bc; --bg:#f5f3ee; --card:#fff; --bdr:#e5e2d9; --ink:#1c1a17; --mu:#6b6660; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         background:var(--bg); color:var(--ink); min-height:100vh; display:flex; align-items:flex-start;
         justify-content:center; padding:40px 16px; }
  .wrap { width:100%; max-width:460px; }
  h1 { font-size:18px; font-weight:700; margin:0 0 4px; }
  .sub { font-size:12px; color:var(--mu); margin:0 0 22px; }
  .card { background:var(--card); border:1px solid var(--bdr); border-radius:12px; padding:22px; margin-bottom:16px; }
  label { display:block; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
          color:var(--mu); margin:0 0 6px; }
  input, select { width:100%; padding:10px 12px; font-size:14px; font-family:inherit; color:var(--ink);
                  background:var(--bg); border:1px solid #c8c4bc; border-radius:8px; margin-bottom:16px; }
  input:focus, select:focus { outline:none; border-color:var(--ac); }
  button { font-family:inherit; font-size:14px; font-weight:600; border-radius:8px; cursor:pointer; padding:10px 16px; }
  .btn-primary { background:var(--ac); color:#fff; border:1px solid var(--ac); width:100%; }
  .btn-primary:disabled { opacity:.5; cursor:not-allowed; }
  .btn-ghost { background:transparent; color:var(--ac); border:1px solid var(--ac); width:100%; margin-bottom:12px; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; }
  .msg { font-size:13px; padding:10px 12px; border-radius:8px; margin-top:4px; display:none; }
  .msg.ok  { display:block; background:#f0fdf4; border:1px solid #bbf7d0; color:#166534; }
  .msg.err { display:block; background:#fef2f2; border:1px solid #fecaca; color:#991b1b; }
  .msg.info{ display:block; background:#fdf0fd; border:1px solid rgba(189,39,188,.2); color:#7a1a79; }
  .hide { display:none; }
  .cur { font-size:13px; color:var(--mu); margin:-6px 0 16px; }
  .cur b { color:var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Customer Terms Admin</h1>
  <p class="sub">Set a customer's billing-terms code. Internal use only.</p>

  <!-- Gate: admin secret -->
  <div class="card" id="gate">
    <label for="secret">Admin secret</label>
    <input id="secret" type="password" placeholder="Paste the shared admin secret" autocomplete="off">
    <button class="btn-primary" id="unlock">Unlock</button>
    <div class="msg" id="gate-msg"></div>
  </div>

  <!-- Editor -->
  <div class="card hide" id="editor">
    <label for="customerId">Primus customer ID</label>
    <input id="customerId" type="text" inputmode="numeric" placeholder="e.g. 1123086640" autocomplete="off">

    <button class="btn-ghost" id="lookup">Look up current terms</button>
    <div class="cur hide" id="current"></div>

    <label for="termsCode">Terms code</label>
    <select id="termsCode">
      <option value="PRE">PRE — Prepaid (pay by card)</option>
      <option value="NET15">NET15</option>
      <option value="NET30">NET30</option>
      <option value="NET45">NET45</option>
      <option value="NET60">NET60</option>
    </select>

    <label for="setBy">Set by (optional — your email)</label>
    <input id="setBy" type="text" placeholder="you@freightandlogistics.com" autocomplete="off">

    <button class="btn-primary" id="save">Save terms</button>
    <div class="msg" id="save-msg"></div>
  </div>
</div>

<script>
  var WORKER = 'https://customer-terms.felipe-b80.workers.dev';
  var _secret = '';

  function show(el, cls, text) { el.className = 'msg ' + cls; el.textContent = text; }

  document.getElementById('unlock').onclick = function () {
    var s = document.getElementById('secret').value.trim();
    var gm = document.getElementById('gate-msg');
    if (!s) { show(gm, 'err', 'Enter the admin secret.'); return; }
    // No separate auth endpoint — the secret is validated on the first write.
    // Unlock the editor optimistically; a wrong secret fails on Save with 401.
    _secret = s;
    document.getElementById('gate').classList.add('hide');
    document.getElementById('editor').classList.remove('hide');
  };

  document.getElementById('lookup').onclick = function () {
    var id = document.getElementById('customerId').value.trim();
    var cur = document.getElementById('current');
    var sm = document.getElementById('save-msg');
    sm.className = 'msg';
    if (!id) { cur.classList.remove('hide'); cur.innerHTML = 'Enter a customer ID first.'; return; }
    cur.classList.remove('hide');
    cur.innerHTML = 'Looking up…';
    fetch(WORKER + '/terms?customerId=' + encodeURIComponent(id))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.termsCode) {
          var when = d.setAt ? new Date(d.setAt).toLocaleString() : 'unknown';
          cur.innerHTML = 'Current: <b>' + d.termsCode + '</b> (set by ' + (d.setBy || '—') + ' on ' + when + ')';
          document.getElementById('termsCode').value = d.termsCode;
        } else {
          cur.innerHTML = 'No entry yet — this customer is treated as <b>normal / non-PRE</b>.';
        }
      })
      .catch(function () { cur.innerHTML = 'Lookup failed — check the customer ID and try again.'; });
  };

  document.getElementById('save').onclick = function () {
    var id = document.getElementById('customerId').value.trim();
    var code = document.getElementById('termsCode').value;
    var setBy = document.getElementById('setBy').value.trim();
    var sm = document.getElementById('save-msg');
    var btn = document.getElementById('save');
    if (!id) { show(sm, 'err', 'Customer ID is required.'); return; }
    btn.disabled = true; show(sm, 'info', 'Saving…');
    fetch(WORKER + '/terms', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Secret': _secret },
      body: JSON.stringify({ customerId: id, termsCode: code, setBy: setBy })
    })
      .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
      .then(function (res) {
        btn.disabled = false;
        if (res.status === 401) { show(sm, 'err', 'Unauthorized — wrong admin secret.'); return; }
        if (res.status !== 200 || !res.d.ok) { show(sm, 'err', 'Failed: ' + (res.d.error || res.status)); return; }
        show(sm, 'ok', 'Saved — customer ' + res.d.customerId + ' is now ' + res.d.termsCode + '.');
      })
      .catch(function () { btn.disabled = false; show(sm, 'err', 'Network error — try again.'); });
  };
</script>
</body>
</html>
