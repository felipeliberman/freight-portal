# invoice-sync — Primus → Stripe invoice sync. Cron-driven, unattended.
#
# Spec: ops/SPEC-primus-stripe-invoice-sync.md
#
# READ BEFORE DEPLOYING:
#   * This worker is DELIBERATELY separate from `stripe-payments`. That worker carries the live
#     payment path and has a history of direct dashboard edits (deployed source drifting from src/).
#     An unattended cron does not belong in that blast radius. Do not merge them.
#   * NEVER edit this worker in the Cloudflare dashboard. src/ is the only source of truth for it,
#     and it is the only worker in this estate for which that is currently true. Keep it that way.
#   * STRIPE_MODE is the phase-1 safety guarantee, not a convenience flag. Phase 1-8 run in TEST.
#     A test-mode invoice cannot reach a customer at all; a live draft can, with one dashboard click.
#
# DEPLOY ORDER — SCHEMA FIRST, CODE SECOND. NEVER THE REVERSE.
#
# A schema change must be applied to the remote D1 BEFORE the code that writes the new column
# deploys. Backwards, the running worker issues UPDATEs against a column that does not exist and
# every write silently fails or errors mid-run.
#
# schema.sql is `CREATE TABLE IF NOT EXISTS` — it will NOT add a column to a table that already
# exists. Added columns need an explicit ALTER.
#
# PENDING (not yet applied to the remote database, required before the next deploy).
#
# Verified absent on remote 2026-08-04 by `PRAGMA table_info(ledger)`: the ledger has 16 columns and
# BOTH ALTERs below are outstanding. This block previously listed only the first of the two, which
# is how a migration list goes stale — schema.sql is now the single source and this points at it.
#
# CONSEQUENCE WORTH KNOWING: the code on main ALREADY writes both columns (src/ledger.js claim() and
# markPaidFirstSeen), so main cannot run against the remote database until these land. It fails loud
# at statement-prepare, not silently. Production is unaffected only because the deployed Worker
# predates those lines.
#
# Statements 1 and 2 are NOT re-runnable (no ADD COLUMN IF NOT EXISTS); 3 and 4 are idempotent.
# Re-running schema.sql repairs neither 1 nor 2. A half-applied run resumes BY COLUMN from a fresh
# PRAGMA. schema.sql carries all four verbatim, with their down migrations.
#
#   1. ALTER TABLE ledger ADD COLUMN paid_first_seen_at INTEGER
#   2. ALTER TABLE ledger ADD COLUMN customer_reference TEXT
#   3. CREATE TABLE IF NOT EXISTS stripe_customer (...)              — quoted in schema.sql
#   4. CREATE UNIQUE INDEX IF NOT EXISTS stripe_customer_id_uniq ... — quoted in schema.sql
#
#   wrangler d1 execute invoice-sync --remote \
#     --command "ALTER TABLE ledger ADD COLUMN paid_first_seen_at INTEGER"
#   wrangler d1 execute invoice-sync --remote \
#     --command "ALTER TABLE ledger ADD COLUMN customer_reference TEXT"
#   # 3 and 4 — a no-op for every table that already exists:
#   wrangler d1 execute invoice-sync --remote --file=./schema.sql
#
#   # then verify positively, per spec §0.25 — do not trust the exit code:
#   wrangler d1 execute invoice-sync --remote --command "PRAGMA table_info(ledger)"
#   wrangler d1 execute invoice-sync --remote \
#     --command "SELECT sql FROM sqlite_master WHERE tbl_name='stripe_customer'"
#
# DOWN: 1 and 2 — do nothing; an inert nullable column is not worth a riskier operation to undo.
# 3 and 4 — DROP TABLE stripe_customer, which EXPIRES AT THE FIRST STRIPE CREATE. After that it
# orphans every Stripe object keyed through it, and there is no down migration, only a forward fix.
#
# Deploy:  cd invoice-sync && wrangler deploy
#
# Secrets (set via `wrangler secret put`, NOT stored here):
#   PRIMUS_USER      — Primus system API username (shared `claude` user — do NOT alter its perms)
#   PRIMUS_PASS      — Primus system API password
#   STRIPE_RK_TEST   — Stripe RESTRICTED key, test mode  (invoice write, customer read)
#   STRIPE_RK_LIVE   — Stripe RESTRICTED key, live mode  (do not set until spec phase 9)
#
# One-time D1 setup (run these, then paste the id below):
#   wrangler d1 create invoice-sync
#   wrangler d1 execute invoice-sync --remote --file=./schema.sql

name = "invoice-sync"
main = "src/index.js"
compatibility_date = "2026-08-03"

# No public surface. This worker is cron-driven and holds Stripe write credentials + Primus
# system-API credentials; it has no reason to be reachable from the internet. Both default to
# enabled, so they are set explicitly rather than left off.
#
# Consequence: the /health route in src/index.js is unreachable in production, by design. Local
# runs are unaffected — `wrangler dev --remote --test-scheduled` proxies locally and does not need
# workers.dev:
#   wrangler dev --remote --test-scheduled --port 8799
#   curl "http://localhost:8799/__scheduled?cron=0+9+*+*+*"
workers_dev = false
preview_urls = false

[vars]
# 'test' | 'live'. Never inferred, never defaulted — an unset/unknown value is a hard failure.
STRIPE_MODE = "test"
# Second, independent switch for live mode. Both this AND STRIPE_MODE="live" are required.
# Flipping to live is spec phase 9 and has its own gate. Do not set this early.
ALLOW_LIVE_MODE = "false"
# Primus system API. Broker-level, all customers. NOT the customer/portal API.
PRIMUS_BASE = "https://restapi.shipprimus.com/api/v1"
# Pilot scope (spec §3.1). Comma-separated ARCodes. Only these get Stripe drafts; everything else
# stays on the current Primus/QBO flow untouched.
#
# "1234" = Freight and Logistics, Inc. - TEST — the OWNER'S OWN test account (§3.1, changed
# 2026-08-04 from "5406" Payless Rugs). Piloting on an account the owner controls removes the
# class of risk where a real customer could receive something before phase 9 is gated.
#
# Verified 2026-08-04 before repointing, all three sources agreeing:
#   invoice LIST ARCode = 1234   invoice DETAIL customerInfo.customerCode = 1234
#   QBO DisplayName = "Freight and Logistics, Inc. - TEST-1234" (exact suffix, single match)
# Exactly 2 invoices carry it and both are the test account's — no collision. Scan coverage was
# complete (0 page failures), so "no other invoice carries 1234" is supportable, not an artefact.
#
# FAILS CLOSED: unset/empty throws. "*" runs the full book and is spec phase 10 — it needs a
# backfill first, because non-allowlisted invoices are never recorded and the rolling poll window
# will not reach back for them. NOTE (§8.865): a backfill beyond ~2026-03 is IMPOSSIBLE through
# this endpoint, and any window spanning 2026-04-29 returns HTTP 500.
AR_ALLOWLIST = "1234"
# Rolling poll window, days. Deliberately OVERLAPS previous runs — that overlap is what catches an
# invoice skipped by a page shift (spec §3). Clamped to 2..90 in code.
POLL_WINDOW_DAYS = "7"

[[d1_databases]]
binding = "DB"
database_name = "invoice-sync"
database_id = "7dfcae90-2627-4d0c-80bb-e7d32853639c"

# Disabled until spec phase 3 (list poll) is built and its exit gate passes.
# A cron firing against an incomplete pass is how a half-processed window happens.
# [triggers]
# crons = ["0 9 * * *"]
